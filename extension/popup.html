<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>SalonBoard Export</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 460px;
      margin: 0;
      padding: 16px;
      color: #222;
      background: #fff;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 12px;
    }

    .section {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .row {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: #444;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #cfd4dc;
      border-radius: 8px;
      font-size: 13px;
      background: white;
    }

    .inline {
      display: flex;
      gap: 8px;
    }

    .inline > div {
      flex: 1;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    #status {
      font-size: 12px;
      white-space: pre-wrap;
      color: #1f2937;
      background: #f3f4f6;
      border-radius: 8px;
      padding: 10px;
      min-height: 56px;
      line-height: 1.5;
    }

    #status.error {
      color: #991b1b;
      background: #fef2f2;
    }

    #preview {
      font-size: 12px;
      white-space: pre-wrap;
      background: #111827;
      color: #e5e7eb;
      border-radius: 8px;
      padding: 10px;
      max-height: 260px;
      overflow: auto;
      line-height: 1.5;
    }

    .hint {
      font-size: 11px;
      color: #6b7280;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>SalonBoard 顧客一覧＋詳細エクスポート</h1>

  <div class="section">
    <div class="row">
      <label for="filePrefix">保存ファイル名の先頭</label>
      <input id="filePrefix" type="text" />
    </div>

    <div class="inline">
      <div class="row">
        <label for="maxPages">最大ページ数</label>
        <input id="maxPages" type="number" min="1" step="1" />
      </div>
      <div class="row">
        <label for="pageDelayMs">一覧ページ待機(ms)</label>
        <input id="pageDelayMs" type="number" min="0" step="100" />
      </div>
    </div>

    <div class="row">
      <label for="detailDelayMs">詳細ページ待機(ms)</label>
      <input id="detailDelayMs" type="number" min="0" step="100" />
    </div>

    <label class="checkbox">
      <input id="includeDetails" type="checkbox" />
      顧客詳細も取得する
    </label>

    <label class="checkbox">
      <input id="includeReservations" type="checkbox" />
      予約履歴を別CSVで保存する
    </label>

    <div class="buttons">
      <button id="testBtn" class="btn-secondary">テスト（現在ページ＋先頭3件詳細）</button>
      <button id="exportBtn" class="btn-primary">本番（全件CSV保存）</button>
    </div>
  </div>

  <div class="section">
    <div class="row">
      <label>状態</label>
      <div id="status">SalonBoardのお客様一覧ページを開いてから実行してください。</div>
    </div>

    <div class="row">
      <label>プレビュー</label>
      <div id="preview">まだ取得していません。</div>
    </div>

    <div class="hint">
      ・本番実行中は <b>ポップアップを閉じない</b> でください。<br>
      ・まずは必ず「テスト」を押してください。<br>
      ・顧客情報の取り扱いは社内ルールに従ってください。
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
